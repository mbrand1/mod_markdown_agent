# mod_markdown_agent — example configuration
#
# Drop this in conf/websites/yourdomain.com.conf or include it
# in the relevant VirtualHost block.
#
# The module activates only when:
#   1. MarkdownAgent is On for the location
#   2. The client sends:  Accept: text/markdown  (Claude Code, OpenCode, etc.)
#   3. The upstream response is Content-Type: text/html
#
# Normal browser requests pass through completely untouched.

# ----- Global load (in main httpd.conf) --------------------------------
LoadModule markdown_agent_module modules/mod_markdown_agent.so

# ----- Per-VirtualHost or global defaults ------------------------------

# Enable for an entire site:
<Directory "/usr/local/apache/htdocs">
    MarkdownAgent            On
    MarkdownAgentExtract     On    # strip nav/header/footer/aside boilerplate
    MarkdownAgentLinks       On    # include [text](url) links
    MarkdownAgentImages      On    # include ![alt](src) images
    MarkdownAgentTokenHeader On    # emit x-markdown-tokens header
    MarkdownAgentDebug       Off   # debug logging for filter operations
</Directory>

# Enable only for your /docs subtree, more aggressive stripping:
<Location "/docs">
    MarkdownAgent            On
    MarkdownAgentExtract     On
    MarkdownAgentLinks       On
    MarkdownAgentImages      Off   # agents usually don't need images
    MarkdownAgentTokenHeader On
</Location>

# Disable for an API path that already returns JSON (belt-and-suspenders,
# the module only touches text/html responses anyway):
<Location "/api">
    MarkdownAgent Off
</Location>

# ----- SSL VirtualHost example -----------------------------------------
#
# <VirtualHost 69.55.64.29:443>
#     ServerName example.com
#     DocumentRoot /var/www/example.com
#
#     SSLEngine On
#     SSLCertificateFile    /usr/local/apache/ssl/example.com.crt
#     SSLCertificateKeyFile /usr/local/apache/ssl/example.com.key
#
#     SSLProtocol -ALL +TLSv1.2 +TLSv1.3
#     SSLHonorCipherOrder On
#     SSLSessionTickets Off
#     SSLOpenSSLConfCmd Curves secp384r1
#     SSLCipherSuite TLSv1.3 TLS_AES_256_GCM_SHA384
#     SSLCipherSuite "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:..."
#
#     <Directory "/var/www/example.com">
#         MarkdownAgent            On
#         MarkdownAgentExtract     On
#         MarkdownAgentLinks       On
#         MarkdownAgentImages      On
#         MarkdownAgentTokenHeader On
#     </Directory>
#
#     ErrorLog  /usr/local/apache/logs/example.com-error_log
#     CustomLog /usr/local/apache/logs/example.com-access_log combined
# </VirtualHost>
