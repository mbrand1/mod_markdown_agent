<!DOCTYPE html>
<html>
<head><title>Relative Links Test</title></head>
<body>

<h1>Relative Links</h1>

<p>Absolute: <a href="https://example.com/page">example.com</a></p>
<p>Site-relative: <a href="/about/contact.html">contact page</a></p>
<p>Relative: <a href="sibling.html">sibling page</a></p>
<p>Image relative: <img src="images/photo.jpg" alt="a photo"></p>
<p>Image absolute: <img src="https://example.com/logo.png" alt="logo"></p>

</body>
</html>
